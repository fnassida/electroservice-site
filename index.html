  *{box-sizing:border-box}
  html,body{height:100%}

  .inner{max-width:60rem;margin:0 auto;width:100%}

  h1{font-family:Archivo,sans-serif;font-weight:900;font-stretch:125%;letter-spacing:-.025em;line-height:1.02;

  p{max-width:46ch;font-size:1.2rem;margin:1.6rem 0 0}
  footer{border-top:1px solid var(--line);padding:1.2rem 1.5rem;color:var(--muted);font-size:.95rem}
  footer .row{max-width:60rem;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem}
  footer nav{display:flex;gap:1.2rem;flex-wrap:wrap}
